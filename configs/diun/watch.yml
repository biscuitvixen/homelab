# Images Diun should watch that have no running container of their own.
# The Docker provider covers everything else automatically.
#
# Repo scanning is off globally (see services/diun.yml), so any entry that
# wants "what is the newest released version" has to ask for it here, along
# with the tag filtering that makes the answer useful.

# Mealie runs as a locally built image (mealie-local:...), which exists in
# no registry and so cannot be watched through the Docker provider. Its
# container carries diun.enable=false; this entry watches the upstream
# image instead, so a new release still reaches you. Acting on it means
# bumping the pinned FROM tag in services/mealie/Dockerfile and rebuilding,
# not pulling.
- name: ghcr.io/mealie-recipes/mealie
  watch_repo: true
  sort_tags: semver
  max_tags: 1
  # Three-part semver only, or every rc and nightly tag becomes a release.
  include_tags:
    - ^v?\d+\.\d+\.\d+$

# Scarlet's CI publishes only a moving :latest tag, so the global
# three-part-semver includeTags filter matches nothing and the Docker
# provider records her as unwatched. Pinning the entry to :latest with
# watch_repo off tracks that tag by digest instead, which is the right
# signal for a continuously published image.
- name: ghcr.io/biscuitvixen/scarlet:latest
  watch_repo: false

# The replicas run the arm build of unbound, a different image name from
# the amd64 one running here. Diun does not run on the replicas, so this
# host watches the image on their behalf. It publishes a moving :latest
# only, hence tracking by digest like scarlet above.
- name: mvance/unbound-rpi:latest
  watch_repo: false
