services:

  tailscale:
    extends:
      file: ./services/tailscale.yml
      service: tailscale
    profiles: ["serv", "pi"]

  unbound:
    extends:
      file: ./services/unbound.yml
      service: unbound
    profiles: ["serv", "pi", "dns"]
    networks:
      - homelab_network

  adguard:
    extends:
      file: ./services/adguard.yml
      service: adguard
    depends_on:
      unbound:
        condition: service_healthy
    profiles: ["serv", "dns"]
    networks:
      - homelab_network

  caddy:
    extends:
      file: ./services/caddy.yml
      service: caddy
    profiles: ["serv", "dns"]
    networks:
      - homelab_network

  homeassistant:
    extends:
      file: ./services/homeassistant.yml
      service: homeassistant
    profiles: ["serv", "iot"]

  mosquitto:
    extends:
      file: ./services/mosquitto.yml
      service: mosquitto
    profiles: ["serv", "iot"]

#  matter-server:
#    extends:
#      file: ./services/matter.yml
#      service: matter-server
#    profiles: ["serv", "iot"]

  atuin:
    extends:
      file: ./services/atuin.yml
      service: atuin
    profiles: ["serv"]
    networks:
      - homelab_network

  vaultwarden:
    extends:
      file: ./services/vaultwarden.yml
      service: vaultwarden
    profiles: ["serv"]
    networks:
      - homelab_network

  mealie:
    extends:
      file: ./services/mealie.yml
      service: mealie
    profiles: ["serv"]
    networks:
      - homelab_network

  docker-socket-proxy:
    extends:
      file: ./services/docker-socket-proxy.yml
      service: docker-socket-proxy
    profiles: ["serv", "pi"]
    networks:
      - socket_proxy

  diun:
    extends:
      file: ./services/diun.yml
      service: diun
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    profiles: ["serv", "pi"]
    networks:
      - homelab_network
      - socket_proxy

  dozzle:
    extends:
      file: ./services/dozzle.yml
      service: dozzle
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    profiles: ["serv", "pi"]
    networks:
      - homelab_network
      - socket_proxy

  uptime-kuma:
    extends:
      file: ./services/uptime-kuma.yml
      service: uptime-kuma
    profiles: ["serv", "pi"]
    networks:
      - homelab_network

  lavalink:
    extends:
      file: ./services/scarlet.yml
      service: lavalink
    profiles: ["serv", "ai"]
    networks:
      - homelab_network

  scarlet:
    extends:
      file: ./services/scarlet.yml
      service: scarlet
    depends_on:
      lavalink:
        condition: service_healthy
    profiles: ["serv", "ai"]
    networks:
      - homelab_network

  # portainer:
  #   extends:
  #     file: ./services/portainer.yml
  #     service: portainer
  #   # profiles: ["serv"]
  #   networks:
  #     - homelab_network

# Shared network for service communication
networks:
  homelab_network:
    driver: bridge
    name: homelab_network

  # Docker API clients and the socket proxy only. internal blocks any
  # route out of it, so the proxy cannot call out and a compromised
  # client cannot reach the daemon except through the proxy's filter.
  socket_proxy:
    driver: bridge
    name: homelab_socket_proxy
    internal: true

volumes:
  # Cached Lavalink plugin jars for Scarlet (chown to uid 322 once, see scarlet.md)
  scarlet_lavalink_plugins:
