# A read-only filter in front of the Docker socket. Anything with the raw
# socket bind-mounted can create, start and delete containers, which is
# far more than a service whose only job is to look should hold. Two
# clients sit behind it: Diun, which enumerates running containers and
# inspects their images, and Dozzle, which streams container logs.
#
# Every permission defaults to denied and POST stays off, so nothing
# behind the proxy can change the daemon's state. If a client logs a
# 403, read its log and add one GET endpoint at a time rather than
# opening POST.
#
# The proxy sits only on the internal socket_proxy network (no route to
# the internet or the rest of the stack); clients join that network in
# addition to homelab_network.
services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy
    restart: unless-stopped
    init: true
    # Ceiling so one service cannot starve the others on a 2 GB host.
    # Measured ~20 MB.
    mem_limit: 64m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    # haproxy writes its pid and stats socket under /run
    tmpfs:
      - /tmp:size=8m,mode=1777
      - /run:size=8m,mode=755
    environment:
      # Diun: CONTAINERS to enumerate what is running, IMAGES to inspect
      # each container's image for its RepoDigest. CONTAINERS alone
      # yields a 403 on every container ("Cannot inspect image").
      CONTAINERS: "1"
      IMAGES: "1"
      # Dozzle: EVENTS for start/stop notifications, LOGS for the log
      # stream itself, INFO for the host summary on its front page.
      EVENTS: "1"
      LOGS: "1"
      INFO: "1"
      VERSION: "1"
      # Explicitly denied. Listed rather than omitted so the intent is
      # visible in the file and nobody has to remember the defaults.
      POST: "0"
      NETWORKS: "0"
      VOLUMES: "0"
      EXEC: "0"
      SERVICES: "0"
      TASKS: "0"
      SECRETS: "0"
      CONFIGS: "0"
      SWARM: "0"
      NODES: "0"
      AUTH: "0"
      BUILD: "0"
      COMMIT: "0"
      DISTRIBUTION: "0"
      PLUGINS: "0"
      SESSION: "0"
      SYSTEM: "0"
    volumes:
      # Read-only: the proxy never needs to write to the socket itself.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      # /_ping is allowed by default (PING=1) and is the canonical "daemon
      # reachable" probe; it exposes nothing sensitive.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2375/_ping"]
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-10s}
      retries: ${HEALTHCHECK_RETRIES:-3}
      start_period: ${HEALTHCHECK_START_PERIOD:-10s}
