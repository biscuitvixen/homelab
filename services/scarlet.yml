# Scarlet - a Discord bot (https://github.com/biscuitvixen/scarlet)
#
# Only the CPU parts run here: the bot and its Lavalink audio server. The LLM
# lives on the GPU host (the Spark) and is reached over the network, so point
# SCARLET_LLM_BASE_URL at that endpoint. See scarlet.md for first-run setup.
#
# NOTE: the bot image is published to GHCR by the scarlet repo's CI. GHCR
# packages are private by default, so either make it public or run
# `docker login ghcr.io` on this host first, otherwise the pull fails.
services:
  scarlet:
    image: ghcr.io/biscuitvixen/scarlet:latest
    container_name: scarlet
    restart: unless-stopped
    # Ceiling so one service cannot starve the other twelve on a 2 GB
    # host. Measured ~93 MB.
    mem_limit: 192m
    environment:
      TZ: ${TZ}
      DISCORD_TOKEN: "${SCARLET_DISCORD_TOKEN}"
      # blank syncs slash commands globally; set a guild id for instant sync
      GUILD_ID: "${SCARLET_GUILD_ID:-}"
      LLM_ENABLED: "${SCARLET_LLM_ENABLED:-true}"
      # the OpenAI-compatible endpoint on the Spark (llama-swap / vLLM)
      LLM_BASE_URL: "${SCARLET_LLM_BASE_URL}"
      LLM_MODEL: "${SCARLET_LLM_MODEL:-}"
      LLM_API_KEY: "${SCARLET_LLM_API_KEY:-not-needed}"
      # false drops the music cog and stops her contacting lavalink at all.
      # Turning it off only frees the memory if lavalink stops too,
      # which needs the compose profile and depends_on changing as well
      MUSIC_ENABLED: "${SCARLET_MUSIC_ENABLED:-true}"
      # she reaches lavalink over the shared homelab network by name
      LAVALINK_URL: "http://lavalink:2333"
      LAVALINK_PASSWORD: "${SCARLET_LAVALINK_PASSWORD:-youshallnotpass}"
      CHAT_GUILD_IDS: "${SCARLET_CHAT_GUILD_IDS:-}"
      OWNER_IDS: "${SCARLET_OWNER_IDS:-}"
      # DEBUG adds the step by step of her time parsing, which is where a
      # quiet failure hides. Applies to her own loggers, not discord.py's
      LOG_LEVEL: "${SCARLET_LOG_LEVEL:-INFO}"
    volumes:
      # sqlite db (user timezones etc) survives container recreates
      - ${DATA:?DATA is not set}/scarlet:/app/data
      # edit personality.md and the next reply uses it, no rebuild needed
      - ../configs/scarlet/personality.md:/app/personality.md:ro

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: lavalink
    restart: unless-stopped
    # Ceiling so one service cannot starve the other twelve on a 2 GB
    # host. JVM, measured ~295 MB.
    mem_limit: 448m
    environment:
      TZ: ${TZ}
      LAVALINK_SERVER_PASSWORD: "${SCARLET_LAVALINK_PASSWORD:-youshallnotpass}"
      # blank on first run, then paste the token the logs print (see scarlet.md)
      YOUTUBE_OAUTH_REFRESH_TOKEN: "${SCARLET_YOUTUBE_OAUTH_REFRESH_TOKEN:-}"
    volumes:
      - ../configs/scarlet/application.yml:/opt/Lavalink/application.yml:ro
      # cache downloaded plugin jars; needs chown to uid 322 once (see scarlet.md)
      - scarlet_lavalink_plugins:/opt/Lavalink/plugins
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/2333' || exit 1"]
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-10s}
      retries: ${HEALTHCHECK_RETRIES:-3}
      start_period: ${HEALTHCHECK_START_PERIOD:-30s}
