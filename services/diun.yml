# Diun watches for new container images and tells you about them. It does
# not update anything, which is the entire point: it replaced watchtower
# after an unattended update walked mealie into a build that SIGILLs on
# this host's pre-SSE4.2 CPU and left it crash-looping for three months
# (see services/mealie/Dockerfile). Updates are now applied by hand with
# scripts/update.sh, on your schedule.
#
# Mirrors the working setup on atlas. Talks to Docker through
# docker-socket-proxy rather than the raw socket, so it can look but not
# touch. See services/diun.md for setup and day-to-day use.
services:
  diun:
    image: crazymax/diun:latest
    container_name: diun
    restart: unless-stopped
    # Ceiling so one service cannot starve the other twelve on a 2 GB
    # host. Measured ~17 MB.
    mem_limit: 64m
    command: serve
    # Without this the container hostname is its own container ID, and
    # {{ .Meta.Hostname }} in the notification template renders as a
    # meaningless hex string. Naming it after the host is what makes a
    # Discord message identifiable when more than one machine reports
    # into the same account.
    hostname: ${SERVER_NAME:-homelab}
    environment:
      TZ: ${TZ}
      LOG_LEVEL: "info"

      # Discovery: every running container is watched unless it carries
      # the label diun.enable=false.
      DIUN_PROVIDERS_DOCKER: "true"
      DIUN_PROVIDERS_DOCKER_ENDPOINT: "tcp://docker-socket-proxy:2375"
      DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT: "true"
      # Images watched without a corresponding container, e.g. the
      # upstream mealie image we rebuild locally.
      DIUN_PROVIDERS_FILE_FILENAME: "/watch.yml"

      # Watch the exact tag each container runs, and report when THAT tag's
      # digest changes. Repo scanning (watchRepo) is deliberately off here:
      # it reports the newest semver tag in a repository, which for a stack
      # running :latest is the wrong question. It would say "caddy 2.11.4
      # exists" while never noticing that the :latest you run has moved,
      # and the digests of :latest and 2.11.4 differ even when the content
      # is identical, so comparing across them yields false positives.
      #
      # Repo scanning is enabled per-entry in configs/diun/watch.yml for
      # the one case where a version number is what matters: mealie, which
      # is pinned and rebuilt by hand.
      DIUN_DEFAULTS_WATCHREPO: "false"

      DIUN_WATCH_SCHEDULE: "${DIUN_SCHEDULE:-0 */6 * * *}"
      # Without this the very first run announces every image at once.
      DIUN_WATCH_FIRSTCHECKNOTIF: "false"

      DIUN_NOTIF_DISCORD_WEBHOOKURL: ${DIUN_NOTIF_DISCORD_WEBHOOKURL}
      DIUN_NOTIF_DISCORD_RENDERFIELDS: "false"
      DIUN_NOTIF_DISCORD_RENDEREMBEDS: "false"
      # Leads with the host name so a message is identifiable at a glance
      # when several machines notify the same Discord. Otherwise identical
      # to the template used on the VPS: image name, tag, and whether the
      # tag is newly available or an existing one was updated in place.
      DIUN_NOTIF_DISCORD_TEMPLATEBODY: '**[{{ .Meta.Hostname }}]** {{ if .Entry.Image.HubLink }}[**{{ regexReplaceAll ".*/" "" .Entry.Image.Path }}** {{ .Entry.Image.Tag }}]({{ .Entry.Image.HubLink }}){{ else }}**{{ regexReplaceAll ".*/" "" .Entry.Image.Path }}** {{ .Entry.Image.Tag }}{{ end }} {{ if eq (printf "%v" .Entry.Status) "new" }}available{{ else }}updated{{ end }}'

      DIUN_DB_PATH: "/data/diun.db"
    volumes:
      - ${DATA:?DATA is not set}/diun:/data
      - ../configs/diun/watch.yml:/watch.yml:ro
    healthcheck:
      test: ["CMD", "diun", "healthcheck"]
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-10s}
      retries: ${HEALTHCHECK_RETRIES:-3}
      start_period: ${HEALTHCHECK_START_PERIOD:-15s}
