services:
  homeassistant:
    image: homeassistant/home-assistant:latest
    container_name: homeassistant
    volumes:
      - ${DATA:?DATA is not set}/homeassistant:/config
    environment:
      - TZ=${TZ}
    restart: unless-stopped
    # Ceiling so one service cannot starve the other twelve on a 2 GB
    # host. Measured ~421 MB, the largest consumer here.
    mem_limit: 640m
    network_mode: host
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123"]
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-15s}
      retries: ${HEALTHCHECK_RETRIES:-3}
      start_period: ${HEALTHCHECK_START_PERIOD:-120s}
