services:
  mealie:
    # Built locally rather than pulled: NumPy 2.x SIGILLs on this host's
    # pre-SSE4.2 CPU. See services/mealie/Dockerfile for the full story.
    build:
      context: ./mealie
    image: mealie-local:v3.22.0-numpy1
    container_name: mealie
    restart: unless-stopped
    # Ceiling so one service cannot starve the other twelve on a 2 GB
    # host. Measured ~324 MB.
    mem_limit: 512m
    labels:
      # This image is built locally and exists in no registry, so Diun's
      # Docker provider has nothing to check and would only log errors.
      # The upstream image is watched via configs/diun/watch.yml instead;
      # acting on that notification means bumping the pinned FROM tag and
      # rebuilding, not pulling.
      diun.enable: "false"
      # Read by scripts/check-updates.sh: the upstream this local image is
      # built from, so the update list can still show what's available.
      homelab.watch-image: "ghcr.io/mealie-recipes/mealie"
    # Remove port publishing - only accessible via Caddy
    # Re-added for now
    ports:
      - "9000:9000"
    environment:
      TZ: ${TZ}
      
      # Application Settings
      ALLOW_SIGNUP: "true"
      MAX_WORKERS: 1
      WEB_CONCURRENCY: 1
      BASE_URL: https://mealie.lan
      
      # Database Settings (using SQLite by default)
      DB_ENGINE: sqlite
      
    volumes:
      - ${DATA:?DATA is not set}/mealie:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/api/app/about')"]
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-10s}
      retries: ${HEALTHCHECK_RETRIES:-3}
      start_period: ${HEALTHCHECK_START_PERIOD:-40s}
